[package]
name = "glasir"
version = "0.13.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Deterministic code intelligence: a queryable graph of a repository, served over MCP"
repository = "https://github.com/Attackwave/glasir"
publish = false

[dependencies]
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# SHA-256 for token hashes and the system random source, from the crypto
# library rustls already links rather than written out here.
ring = "0.17.14"
native_parsers = { version = "0.1.0", path = "parsers" }
# `.gitignore` semantics (nested files, negation, anchoring, `**`) are what
# decide the indexed scope; a hand-written subset would get one of them wrong.
ignore = "0.4.33"

# musl's allocator is what a static Linux binary costs: measured, analysis ran
# 1.5x slower on one tree and 3.5x on a generated 300k-line one. Only the
# musl build links this; glibc and the other platforms keep their system
# allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
