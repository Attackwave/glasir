[package]
name = "glasir"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
native_parsers = { version = "0.1.0", path = "parsers" }
