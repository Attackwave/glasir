[package]
name = "native_parsers"
version = "0.1.0"
edition = "2021"
publish = false
# Written from scratch: no grammar, query or parser logic is derived from
# tree-sitter or any other project, so nothing here carries a foreign licence.
# What it encodes are language syntax rules — keywords, delimiters, comment
# markers — which are facts rather than protectable expression. Glasir may
# therefore licence this as it licences the rest of itself.
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1.4", default-features = false, features = ["std", "serde", "parse"] }
