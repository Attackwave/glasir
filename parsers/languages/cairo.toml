schema_version = 1
language = "cairo"
revision = 1

[lexical]
line_comments = ["///", "//"]
doc_comments = ["///"]

[calls]
exclude = ["if", "else", "loop", "while", "match", "return", "let", "mut", "assert", "impl", "trait", "use"]

[generic]
braces = true
receivers = ["::", "."]
definitions = [
    { keyword = "fn", scope = "body_with_docs" },
    { keyword = "mod", scope = "body" },
    { keyword = "struct", scope = "body" },
    { keyword = "const", scope = "statement" },
]
