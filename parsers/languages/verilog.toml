schema_version = 1
language = "verilog"
revision = 1

[lexical]
# `'` opens a name here, not a string (sized numbers: `4'b1010`).
quote_identifiers = true
line_comments = ["//"]
doc_comments = ["//"]
block_comment = ["/*", "*/"]

[calls]
exclude = ["if", "while", "for", "case", "begin", "end", "initial", "always", "always_comb", "always_ff", "assign"]
