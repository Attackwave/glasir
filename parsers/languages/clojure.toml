schema_version = 1
language = "clojure"
revision = 1

[lexical]
# `'` opens a name here, not a string (quoted forms: `'sym`).
quote_identifiers = true
line_comments = [";;;", ";;", ";"]
doc_comments = [";;;", ";;"]
identifier_dashes = true

[calls]
exclude = ["if", "when", "let", "loop", "recur", "do", "fn", "cond", "case", "quote"]
