schema_version = 1
language = "janet"
revision = 1

[lexical]
# `'` opens a name here, not a string (quoted forms: `'sym`).
quote_identifiers = true
line_comments = ["#"]
doc_comments = ["#"]

[calls]
exclude = ["if", "when", "unless", "cond", "let", "do", "fn", "var", "set", "while", "each", "defn", "def", "defmacro"]
