name: Feature request
description: Propose a concrete, evidence-backed improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user or operational problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected result and compatibility impact.
    validations:
      required: true
