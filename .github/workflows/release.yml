# A tag produces something a buyer can inventory: a binary per platform, a
# checksum beside it, and the SBOM for exactly that build.
#
# Without this there is no answer to "which version is running here", which is
# the question a CVE list is checked against — and an SBOM with no version over
# it inventories nothing. CI proves the code is good; this is what makes a
# build of it something an organisation can adopt.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The gates run on the tag too, not only on the branch it came from: a
      # tag can be moved, and a release nobody re-checked is a release nobody
      # can trust.
      - name: gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          cargo test --manifest-path parsers/Cargo.toml --target-dir target/parser-tests
          cargo build --release --locked
          ./target/release/glasir selfcheck
          ./target/release/glasir benchmark . --check
          ./target/release/glasir langcheck bench/langs --check
          ./target/release/glasir guard .
          cargo install cargo-audit --locked
          cargo audit

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: check the binary reports its version
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/glasir
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version | grep -q "^glasir "

      - name: package
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/glasir
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          NAME=glasir-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "dist/$NAME"
          cp "$BIN" LICENSE NOTICE README.md SECURITY.md "dist/$NAME/"
          cd dist && tar czf "$NAME.tar.gz" "$NAME"
          # Checksums are per file and beside it, so a mirror cannot serve a
          # different archive under the same name unnoticed.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            openssl dgst -sha256 -r "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  # Generated from the tagged Cargo.lock, so it describes the build being
  # released rather than whatever was on the branch that day.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  container:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/glasir
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/glasir
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: keyless sign image digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done

  publish:
    needs: [build, sbom, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
