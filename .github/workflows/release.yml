# A tag produces something a buyer can inventory: a binary per platform, a
# checksum beside it, and the SBOM for exactly that build.
#
# Without this there is no answer to "which version is running here", which is
# the question a CVE list is checked against — and an SBOM with no version over
# it inventories nothing. CI proves the code is good; this is what makes a
# build of it something an organisation can adopt.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # musl, statically linked: a glibc build from the newest runner needs
          # that runner's glibc (2.39) and did not start on Ubuntu 22.04,
          # Debian 12 or RHEL 9. mimalloc keeps the static build as fast.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          # Native, like the container images: ARM Linux is Graviton and
          # Ampere servers, and cross-compiled binaries would ship untested.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          # The last Intel image GitHub offers; it is retired in August 2027,
          # after which this entry has to cross-compile from Apple Silicon.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The gates run on the tag too, not only on the branch it came from: a
      # tag can be moved, and a release nobody re-checked is a release nobody
      # can trust.
      - name: gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          cargo test --manifest-path parsers/Cargo.toml --target-dir target/parser-tests
          cargo build --release --locked
          ./target/release/glasir selfcheck
          ./target/release/glasir benchmark . --check
          ./target/release/glasir langcheck bench/langs --check
          ./target/release/glasir guard .
          cargo install cargo-audit --locked
          cargo audit

      - name: musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: check the binary reports its version
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/glasir
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          # The archive is named after the tag, so the binary inside must say
          # the same version — v0.2.0 would otherwise ship a binary answering
          # 0.1.0. A release candidate's suffix is not in Cargo.toml.
          WANT="${GITHUB_REF_NAME#control-}"
          WANT="${WANT#v}"
          WANT="${WANT%%-*}"
          GOT=$("$BIN" --version | tr -d '\r')
          echo "$GOT"
          [ "$GOT" = "glasir $WANT" ]

      - name: install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: package
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/glasir
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          # Tags carry a prefix (`v`, `control-v`); the archive names the product
          # once and the platform the way a user would look for it.
          VERSION="${GITHUB_REF_NAME#control-}"
          VERSION="${VERSION#v}"
          NAME=glasir-$VERSION-${{ matrix.platform }}
          mkdir -p "dist/$NAME"
          cp "$BIN" LICENSE NOTICE README.md SECURITY.md "dist/$NAME/"
          # MIT, ISC, BSD and Unicode require their copyright and licence text
          # to travel with a binary; about.toml fails on any licence not listed.
          cargo about generate --locked --fail about.hbs -o "dist/$NAME/THIRD-PARTY-LICENSES.txt"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            ARCHIVE="$NAME.zip"
            7z a -tzip "$ARCHIVE" "$NAME" >/dev/null
          else
            ARCHIVE="$NAME.tar.gz"
            tar czf "$ARCHIVE" "$NAME"
          fi
          # Checksums are per file and beside it, so a mirror cannot serve a
          # different archive under the same name unnoticed.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            openssl dgst -sha256 -r "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  # Generated from the tagged Cargo.lock, so it describes the build being
  # released rather than whatever was on the branch that day.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  # Build each architecture on matching hardware. Building a Rust image for
  # ARM through QEMU is correct but unacceptably slow for a release pipeline.
  container-build:
    needs: [build]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/glasir
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ matrix.suffix }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  # Publish one manifest only after both native images are present. Consumers
  # retain the familiar tag and Docker selects the matching architecture.
  container:
    needs: [container-build]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/glasir
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - id: manifest
        name: publish multi-architecture manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/glasir
          REF: ${{ github.ref_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="${IMAGE,,}"
          for tag in $TAGS; do
            docker buildx imagetools create --tag "$tag" \
              "$IMAGE:$REF-amd64" "$IMAGE:$REF-arm64"
          done
          FIRST_TAG=$(printf '%s\n' "$TAGS" | head -n 1)
          DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{.Manifest.Digest}}')
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/glasir
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: keyless sign image digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done

  # The Homebrew formula and the Scoop manifest, rendered from the checksums
  # this release published. Attached to every release, so Scoop can install
  # straight from it; pushed to the tap and the bucket only for a stable
  # version, and only when PACKAGES_TOKEN (contents: write on both) is set.
  packages:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: python3 packaging/render.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dist dist --out packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*
      # An expired token costs the tap and bucket update, never the release:
      # the step shows failed, and `publish` still runs.
      - name: publish to the tap and the bucket
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PACKAGES_TOKEN is not set: the formula and manifest are attached to the release only."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          publish() (
            repo=$1 dest=$2 src=$PWD/$3
            git clone -q "https://x-access-token:${TOKEN}@github.com/${owner}/${repo}.git" "/tmp/${repo}"
            cd "/tmp/${repo}"
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
            git add -A
            git diff --cached --quiet && exit 0
            git -c user.name="glasir release" -c user.email="release@users.noreply.github.com" \
              commit -qm "glasir ${GITHUB_REF_NAME}"
            git push -q
          )
          publish homebrew-glasir Formula/glasir.rb packages/glasir.rb
          publish scoop-glasir bucket/glasir.json packages/glasir.json

  publish:
    needs: [build, sbom, container, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "!*.dockerbuild"
      - uses: softprops/action-gh-release@v2
        with:
          # A tag with a suffix (`v0.1.0-rc.6`) is a release candidate. Unmarked,
          # GitHub listed it as the latest release, which is what "download the
          # latest" and Scoop's update check resolve to.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*
          generate_release_notes: true
