# The review this repository offers others, applied to its own pull requests:
# risk, dependents and the tests to run, as one comment kept current.
name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit has to be in the clone for the diff.
          fetch-depth: 0
      - uses: Attackwave/glasir@ef9f1eb51a504d8f173c66388f746bd5c3110d90 # v0.11.8
