# The review this repository offers others, applied to its own pull requests:
# risk, dependents and the tests to run, as one comment kept current.
name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit has to be in the clone for the diff.
          fetch-depth: 0
      - uses: Attackwave/glasir@57bc461ab41f8efeb3ecc6a7b77c6452e26a5f55 # v0.13.1
        # The binary of the same release as the action, not whatever is latest.
        with:
          version: v0.13.1
