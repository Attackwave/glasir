# The review this repository offers others, applied to its own pull requests:
# risk, dependents and the tests to run, as one comment kept current.
name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit has to be in the clone for the diff.
          fetch-depth: 0
      - uses: Attackwave/glasir@7f2a15183df2c118e11e1de0519f7fee968f45c3 # v0.11.1
